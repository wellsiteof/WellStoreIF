<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Well Store</title>

  <link rel="stylesheet" href="visual.css">
</head>

<body>

<section class="secao-contato">

  <h2>Entre em contato com a Well Store</h2>

  <p>Preencha o formulário abaixo para falar conosco.</p>

  <form id="formContato" class="form-contato">

    <input type="text" id="nome" placeholder="Seu nome">

    <input type="email" id="email" placeholder="Seu e-mail">

    <input type="tel" id="telefone" placeholder="Seu telefone">

    <select id="assunto">
      <option value="">Escolha um assunto</option>
      <option value="duvida">Dúvida</option>
      <option value="sugestao">Sugestão</option>
      <option value="cadastro">Cadastro</option>
      <option value="compra">Compra</option>
    </select>

    <textarea id="mensagem" placeholder="Digite sua mensagem"></textarea>

    <button type="submit">
      Enviar contato
    </button>

  </form>

  <p id="respostaFormulario"></p>

  <a href="index.html" class="voltar">
    Voltar para a loja
  </a>

</section>

<script src="script.js"></script>

</body>
</html>
